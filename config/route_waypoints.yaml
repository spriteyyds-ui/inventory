# Nav2巡航路线配置。
# waypoints 是覆盖一侧货柜区域的巡航路线点，不是单个货柜的精确位置。
# 所有坐标均为 map 坐标系；实际值需要在建图后通过 RViz 标定替换。
routes:
  left_route:
    frame_id: map
    waypoints:
      - {x: 1.477, y: -0.015, yaw: -0.0134}
      - {x: 4.063, y: -0.056, yaw: -0.0196}
      - {x: 5.330, y: -0.054, yaw: -0.0065}

      - {x: 5.475, y: -0.038, yaw: 0.2215}
      - {x: 5.485, y: -0.010, yaw: 0.8652}
      - {x: 5.474, y: 0.016, yaw: 1.5144}

      - {x: 5.436, y: 0.516, yaw: 1.5842}
      - {x: 5.397, y: 0.639, yaw: 2.3840}
      - {x: 5.380, y: 0.661, yaw: 2.6097}
      - {x: 5.343, y: 0.694, yaw: 2.8096}

      - {x: 5.345, y: 0.680, yaw: -2.960}
      
  right_route:
    frame_id: map
    waypoints:
      - {x: 2.543, y: -0.092, yaw: -0.0384}
      - {x: 5.756, y: -0.127, yaw: -0.0199}

      - {x: 5.883, y: -0.127, yaw: -0.4267}
      - {x: 5.889, y: -0.145, yaw: -1.2854}

      - {x: 5.834, y: -0.487, yaw: -2.0563}
      - {x: 5.796, y: -0.508, yaw: -2.4627}

      - {x: 5.880, y: -0.532, yaw: -3.1416}

side_route_map:
  left: left_route
  right: right_route

