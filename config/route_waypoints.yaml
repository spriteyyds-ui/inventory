# Nav2巡航路线配置。
# waypoints 是覆盖一侧货柜区域的巡航路线点，不是单个货柜的精确位置。
# 所有坐标均为 map 坐标系；实际值需要在建图后通过 RViz 标定替换。
routes:
  left_route:
    frame_id: map
    waypoints:
      # - {x: 5.111, y: 0.098, yaw: -0.0144}
      # - {x: 10.210, y: -0.049, yaw: -0.0396}
      # - {x: 15.269, y: -0.253, yaw: -0.0295}
      # - {x: 20.180, y: -0.520, yaw: -0.0104}
      - {x: 25.263, y: -0.598, yaw: 0.0296}

      # 转弯前过渡
      - {x: 25.798, y: -0.562, yaw: 0.0277}
      - {x: 25.995, y: -0.554, yaw: 0.2295}
      - {x: 25.995, y: -0.535, yaw: 0.6420}
      - {x: 25.999, y: -0.531, yaw: 1.0451}
      - {x: 26.012, y: -0.488, yaw: 1.4646}

      # 进入竖向段
      - {x: 26.026, y: -0.229, yaw: 1.6170}
      - {x: 26.018, y: 0.043, yaw: 1.5816}
      - {x: 26.005, y: 0.326, yaw: 1.5834}
      - {x: 26.007, y: 0.595, yaw: 1.5653}
      - {x: 26.009, y: 1.121, yaw: 1.5496}

      # 最后姿态对正
      - {x: 25.996, y: 1.183, yaw: 1.9680}
      - {x: 26.020, y: 1.206, yaw: 2.3825}
      - {x: 25.998, y: 1.213, yaw: 2.7951}
      - {x: 26.009, y: 1.214, yaw: -3.1408}

  right_route:
    frame_id: map
    waypoints:
      - {x: 2.997, y: 0.022, yaw: -0.0611}
      - {x: 5.516, y: -0.076, yaw: -0.2937}

      - {x: 5.534, y: -0.110, yaw: -0.7111}
      - {x: 5.523, y: -0.116, yaw: -1.1151}
      - {x: 5.660, y: -0.560, yaw: -1.4353}
      - {x: 5.635, y: -0.585, yaw: -1.6500}
      - {x: 5.612, y: -0.600, yaw: -1.8855}

      - {x: 5.600, y: -0.615, yaw: -2.1500}
      - {x: 5.635, y: -0.615, yaw: -2.4000}
      - {x: 5.690, y: -0.605, yaw: -2.7000}
      - {x: 5.739, y: -0.592, yaw: 3.0800}

side_route_map:
  left: left_route
  right: right_route

