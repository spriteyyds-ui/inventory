# Nav2巡航路线配置。
# waypoints 是覆盖一侧货柜区域的巡航路线点，不是单个货柜的精确位置。
# 所有坐标均为 map 坐标系；实际值需要在建图后通过 RViz 标定替换。
routes:
  left_route:
    frame_id: map
    waypoints:
      - {x: 1.012, y: -0.032, yaw: -0.0329}
      - {x: 1.765, y: -0.057, yaw: -0.0077}
      - {x: 2.537, y: -0.071, yaw: 0.0574}
      - {x: 3.306, y: -0.048, yaw: 0.0349}
      - {x: 4.048, y: -0.035, yaw: 0.0395}
      

  right_route:
    frame_id: map
    waypoints:
      - {x: 4.0, y: 0.0, yaw: 0.0}

side_route_map:
  left: left_route
  right: right_route

