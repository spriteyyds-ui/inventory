# Nav2巡航路线配置。
# waypoints 是覆盖一侧货柜区域的巡航路线点，不是单个货柜的精确位置。
# 所有坐标均为 map 坐标系；实际值需要在建图后通过 RViz 标定替换。
routes:
  left_route:
    frame_id: map
    waypoints:
      - {x: 0.799, y: -0.075, yaw: -0.0661}
      - {x: 1.801, y: -0.141, yaw: -0.0616}
      - {x: 2.838, y: -0.287, yaw: -0.1810}
      - {x: 3.678, y: -0.568, yaw: -0.4877}
      - {x: 4.565, y: -0.930, yaw: -0.0099}
      - {x: 5.476, y: -0.909, yaw: 0.2778}
      - {x: 5.984, y: -0.468, yaw: 0.9301}
      - {x: 6.265, y: 0.144, yaw: 1.5305}
      - {x: 6.187, y: 0.672, yaw: 2.1473}
      - {x: 5.760, y: 0.968, yaw: 2.8110}
      - {x: 5.068, y: 1.013, yaw: -2.8708}
      - {x: 4.579, y: 0.725, yaw: -2.2416}
      - {x: 4.800, y: 0.575, yaw: -3.1400}


  right_route:
    frame_id: map
    waypoints:
      - {x: 0.799, y: 0.075, yaw: 0.0661}
      - {x: 1.801, y: 0.141, yaw: 0.0616}
      - {x: 2.838, y: 0.287, yaw: 0.1810}
      - {x: 3.678, y: 0.568, yaw: 0.4877}
      - {x: 4.565, y: 0.930, yaw: 0.0099}
      - {x: 5.476, y: 0.909, yaw: -0.2778}
      - {x: 5.984, y: 0.468, yaw: -0.9301}
      - {x: 6.265, y: -0.144, yaw: -1.5305}
      - {x: 6.187, y: -0.672, yaw: -2.1473}
      - {x: 5.760, y: -0.968, yaw: -2.8110}
      - {x: 5.068, y: -1.013, yaw: 2.8708}
      - {x: 4.579, y: -0.725, yaw: 2.2416}
      - {x: 4.800, y: -0.575, yaw: 3.1400}

side_route_map:
  left: left_route
  right: right_route

