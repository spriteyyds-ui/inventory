    line_tracking_cte_warn_threshold_m: 0.20                            # 出缝 current_y 与 configured_y 差距超此值打 WARN
    line_tracking_cte_fallback_to_config_threshold_m: 0.35              # 差距超此值 fallback 到配置 fixed_y

    # Stanley 统一参数（line_tracking_cte_control_enabled=true 时生效）
    stanley_cte_gain: 0.15                                              # 横向误差增益
    stanley_softening_speed: 0.12                                       # 低速软化项
    stanley_max_yaw_offset_rad: 0.05                                    # yaw_offset 最大值，单位 rad
