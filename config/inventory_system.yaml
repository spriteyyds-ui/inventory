    enter_front_sector_end_deg: 20.0                                    # 进缝前方安全扇区结束角，单位 deg；调大扩大左前检测
    enter_front_left_sector_start_deg: 20.0                             # 进缝左前安全扇区起始角，单位 deg；调大会缩小左前覆盖
    enter_front_left_sector_end_deg: 75.0                               # 进缝左前安全扇区结束角，单位 deg；调大会扩大左侧覆盖
    enter_left_side_sector_start_deg: 75.0                              # 进缝左侧安全扇区起始角，单位 deg；调大会更偏侧后
    enter_left_side_sector_end_deg: 120.0                               # 进缝左侧安全扇区结束角，单位 deg；调大会扩大后侧覆盖
    enter_front_right_sector_start_deg: -75.0                           # 进缝右前安全扇区起始角，单位 deg；调小扩大右侧覆盖
    enter_front_right_sector_end_deg: -20.0                             # 进缝右前安全扇区结束角，单位 deg；调小缩小正前覆盖
    enter_right_side_sector_start_deg: -120.0                           # 进缝右侧安全扇区起始角，单位 deg；调小扩大后侧覆盖
    enter_right_side_sector_end_deg: -75.0                              # 进缝右侧安全扇区结束角，单位 deg；调小更偏侧前

    tracking_kp_distance: 0.80                                          # TARGET_TRACKING 距离闭环比例增益；调大会距离修正更快但可能振荡
    tracking_kp_heading: 1.20                                           # TARGET_TRACKING 航向闭环比例增益；调大会朝向修正更快
    tracking_offset_scale_px: 320.0                                     # 图像水平偏移归一化尺度，单位 px；调大会同样像素偏差产生更小角速度
    tracking_max_angular: 0.80                                          # TARGET_TRACKING 角速度限幅，单位 rad/s；调大会允许更快转向

    distance_tolerance: 0.25                                            # 目标侧向距离对齐允许误差，单位 m；调大会更容易判定稳定，调小对齐更严格
    target_distance_aligned_min_m: 0.25                                 # 目标侧向距离合适区间下限，单位 m；低于该值认为过近并小幅后退
    target_distance_aligned_max_m: 0.75                                 # 目标侧向距离合适区间上限，单位 m；不高于该值且不低于下限时可稳定后找缝
    target_distance_gap_threshold_m: 1.50                               # 目标侧向距离开放空间阈值，单位 m；超过该值认为雷达扫到缝隙并停止向前追
    target_distance_gap_confirm_count: 1                                # 开放空间判定连续确认次数，单位 次；调大会更抗噪但可能延迟进入找缝
    distance_stable_time_sec: 1.2                                       # 距离和航向保持稳定所需时长，单位 s；调大会确认更稳但等待更久
    recognition_timeout_sec: 1.0                                        # 跟踪有效性使用的识别超时时间，单位 s；调大会更容忍短暂丢识别
    target_recognition_stable_frames: 3                                 # 停止 Nav2 路线搜索前所需连续识别帧数，单位 帧；调大会更稳但停车更慢
    target_recognition_stable_time_sec: 0.30                            # 目标识别稳定所需最小时长，单位 s；调大会减少误停，调小响应更快
    post_track_retreat_distance: 0.10                                   # SEARCH_GAP 超时后静态确认前的固定后退距离，单位 m；调大会后退更多
    retreat_speed: 0.10                                                 # 跟踪后后退线速度，单位 m/s；调大会后退更快但定位误差可能变大
    wait_gap_stop_settle_sec: 0.25                                      # 后退或调整动作后等待车体稳定时间，单位 s；调大会检测更稳但耗时更长
    search_gap_speed: 0.08                                              # SEARCH_GAP 朝预期间隙移动的低速速度，单位 m/s；调大会找缝更快但可能越过目标
    search_gap_forward_timeout_sec: 20.0                                # SEARCH_GAP 前向搜索超时，单位 s；调大会搜索更远，调小更快进入微调
    search_gap_backward_timeout_sec: 20.0                               # SEARCH_GAP 后向搜索超时，单位 s；调大会后向搜索更远
    gap_detect_cycle_timeout_sec: 2.5                                   # WAITING_GAP 单轮间隙检测超时，单位 s；调大会每轮等待更久
    gap_failures_before_adjust: 3                                       # 触发一次位姿调整前允许的失败检测轮数，单位 轮；调大会减少调整频率
    gap_adjust_speed: 0.10                                              # 间隙调整序列运动速度，单位 m/s；调大会调整更快但更难精确
    gap_adjust_sequence: [-0.20, 0.10, -0.20, 0.30]                     # 每个重试阶段的相对调整距离列表，单位 m；正负号决定前后移动方向
    post_gap_detect_advance_enabled: true                               # 检测到间隙后是否额外前进对齐；关闭会直接进入后续进缝流程
    post_gap_detect_advance_distance_m: 0.80                            # 检测到间隙后的额外前进距离，单位 m；调大会更靠近目标间隙
