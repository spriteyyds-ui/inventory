corridor_follower_node:
  ros__parameters:
    scan_topic: /scan                                                   # 走廊居中控制使用的激光雷达输入话题；更换传感器话题时需同步修改
    cmd_vel_topic: /cmd_vel                                             # 底盘速度指令输出话题；改错会导致底盘收不到控制速度
    forward_speed: 0.20                                                 # 走廊模式默认前进速度，单位 m/s；调大会更快但居中修正余量变小
    max_angular_speed: 0.60                                             # 居中修正角速度上限，单位 rad/s；调大会转向更激进，调小更平稳
    pid_kp: 1.20                                                        # 横向误差 PID 比例增益；调大会响应更快但可能振荡
    pid_ki: 0.00                                                        # 横向误差 PID 积分增益；调大会消除长期偏差但易累积过冲
    pid_kd: 0.15                                                        # 横向误差 PID 微分增益；调大会抑制快速变化但会放大噪声
    integral_limit: 1.5                                                 # 积分项绝对值限幅；调大会允许更强积分修正，调小可减少积分饱和
    error_deadband: 0.02                                                # 居中误差死区，单位 m；调大会减少小幅抖动，调小提高对齐精度
    left_start_deg: 60.0                                                # 左侧采样扇区起始角，单位 deg；调大会缩小靠前侧采样范围
    left_end_deg: 120.0                                                 # 左侧采样扇区结束角，单位 deg；调大会扩大靠后侧采样范围
    right_start_deg: -120.0                                             # 右侧采样扇区起始角，单位 deg；调小会扩大靠后侧采样范围
    right_end_deg: -60.0                                                # 右侧采样扇区结束角，单位 deg；调小会缩小靠前侧采样范围
    min_valid_range: 0.05                                               # 走廊控制接受的最小雷达距离，单位 m；调大会过滤近距离噪声
    max_valid_range: 8.0                                                # 走廊控制接受的最大雷达距离，单位 m；调小会忽略远处墙面或货柜
    enable_control_topic: /inventory/corridor_enable                    # 走廊跟随使能控制话题；状态机通过它启停居中控制
    reverse_control_topic: /inventory/corridor_reverse                  # 走廊跟随后退模式控制话题；置真后速度方向按后退处理
    set_enable_service_name: /inventory/set_corridor_following          # 走廊跟随启停服务名；改名需同步调用端

number_recognizer_node:
  ros__parameters:
    camera_topic: /c100_right/image_raw                                 # 动态相机选择失败时的兜底输入图像话题
    left_camera_topic: /c100_left/image_raw                             # entry_side=left 时使用的车身左侧相机图像话题
    right_camera_topic: /c100_right/image_raw                           # entry_side=right 时使用的车身右侧相机图像话题
    target_cabinet_topic: /inventory/current_target_cabinet             # 当前目标货柜号话题；任务管理器发布，识别节点据此切换相机
    route_waypoints_file: config/route_waypoints.yaml                   # 读取 cabinet_entry_side_map 的路线配置文件；不要复制映射到本文件
    recognized_topic: /inventory/recognized_number                      # 货柜编号识别结果输出话题；任务管理器订阅该话题
    debug_a4_topic: /inventory/debug_a4_region                          # A4 区域调试图输出话题；用于观察透视矫正效果
    debug_digits_topic: /inventory/debug_digits                         # 数字分割调试图输出话题；用于检查候选数字裁剪
    visualization_topic: /inventory/visualization                       # 最终识别可视化图输出话题；用于人工查看叠加结果
    trigger_service_name: /inventory/trigger_recognition                # 手动触发或启停识别的服务名；改名需同步测试或调用脚本
    enable_control_topic: /inventory/recognizer_enable                  # 识别器使能控制话题；任务阶段切换时控制是否运行识别
    distance_overlay_topic: /inventory/target_distance                  # 可视化叠加距离输入话题；缺失时只影响显示距离文本

    recognition_target_style: circle_marker                             # 识别目标样式：circle_marker 为圆形标靶；legacy_a4_digit 为旧 A4 黑字模式
    enable_on_start: true                                               # 启动后是否默认开启识别；设为 false 可等任务管理器明确使能
    min_confidence: 0.80                                                # 整体识别有效的最低置信度比例；调大会更严格，调小更容易接受低置信结果
    max_attempts: 20                                                    # 本地连续失败计数上限，单位 次；调大会延长重试，调小更快复位
    attempt_interval: 0.1                                               # 两次推理尝试的最小间隔，单位 s；调大会降低算力占用但响应更慢
    distance_overlay_timeout_sec: 0.8                                   # 距离叠加消息最大有效时间，单位 s；调大会更容忍旧距离，调小显示更实时
    enable_union_fallback_classification: true                          # 是否启用联合区域兜底分类；关闭可减少误合并，开启可提高断裂数字召回
    cabinet_id_min: 1                                                   # 接受的最小货柜编号；调大会过滤更小编号
    cabinet_id_max: 36                                                  # 接受的最大货柜编号；仓库编号增加时需调大

    known_digit_height_px: 40.0                                         # 视觉测距参考数字高度，单位 px；调大会使估计距离相对变大
    known_distance_m: 1.0                                               # 参考数字高度对应的实际距离，单位 m；调大会按比例放大视觉距离估计
    distance_focal_length: 600.0                                        # 针孔测距等效焦距因子，单位 px；调大会使同样像素高度估计为更远

    a4_gaussian_kernel: 5                                               # A4 检测高斯模糊核尺寸，单位 px；调大会更抗噪但边缘变钝，通常取奇数
    a4_morph_kernel_size: 5                                             # A4 检测形态学核尺寸，单位 px；调大会连接断边但可能吞掉细节
    a4_min_area_ratio: 0.01                                             # A4 轮廓面积占图像面积的最小比例；调大会过滤小目标，调小可识别更远纸张
    a4_approx_epsilon: 0.02                                             # A4 轮廓多边形拟合精度比例；调大会轮廓更粗略，调小更贴合边缘
    a4_min_aspect_ratio: 0.55                                           # A4 候选最小宽高比；调大会过滤更窄目标
    a4_max_aspect_ratio: 2.2                                            # A4 候选最大宽高比；调小会过滤更扁或视角更斜的目标

    clahe_clip_limit: 2.0                                               # 分割预处理 CLAHE 对比度限制；调大会增强暗部但可能放大噪声
    clahe_grid_size: 8                                                  # CLAHE 网格尺寸，单位 个；调大会局部增强更粗，调小更细
    pre_blur_kernel: 5                                                  # 阈值化前高斯模糊核尺寸，单位 px；调大会去噪更强但细笔画变弱
    median_blur_kernel: 3                                               # 中值滤波核尺寸，单位 px；0 或 1 关闭，调大会减少椒盐噪声但可能磨损数字
    adaptive_thresh_block_size: 11                                      # 自适应阈值窗口尺寸，单位 px；调大会看更大局部区域，必须为奇数
    adaptive_thresh_c: 4                                                # 自适应阈值偏移量，单位 灰度级；调大会让前景更少，调小保留更多笔画
    enable_otsu_fusion: true                                            # 是否融合 Otsu 阈值结果；开启提高光照变化鲁棒性，关闭可减少过度二值化
    binary_cleanup_enabled: true                                        # 是否清理小连通域；开启减少噪点，关闭可避免细小数字笔画被删
    binary_cleanup_min_component_area: 20                               # 保留连通域的最小面积，单位 px^2；调大会去噪更强但可能删小笔画
    binary_cleanup_min_component_width: 3                               # 保留连通域的最小宽度，单位 px；调大会过滤窄噪声但可能影响数字 1
    binary_cleanup_min_component_height: 3                              # 保留连通域的最小高度，单位 px；调大会过滤低矮噪声但可能影响远距离数字
    morph_kernel_size: 1                                                # 兼容用形态学核尺寸，单位 px；调大会增强形态操作影响
    morph_open_kernel_size: 1                                           # 开运算去噪核尺寸，单位 px；调大会去小噪更强但可能擦掉细笔画
    morph_close_kernel_size: 5                                          # 闭运算连接笔画核尺寸，单位 px；调大会更易连通断裂笔画但可能粘连邻近噪声
    min_digit_area: 50                                                  # 数字候选最小轮廓面积，单位 px^2；调大会去除小噪点，调小保留远处小数字
    max_digit_area: 5000                                                # 数字候选最大轮廓面积，单位 px^2；调小过滤大块边框，调大允许近距离大数字
    min_digit_area_ratio: 0.0001                                        # 数字候选面积相对 A4 区域的最小比例；调大会过滤碎片，调小保留远处数字
    max_digit_area_ratio: 0.35                                          # 数字候选面积相对 A4 区域的最大比例；调小过滤边框块，调大允许近距离数字
    min_digit_width: 6                                                  # 数字候选最小宽度，单位 px；调大会过滤细噪声，调小更容易保留数字 1
    min_digit_height: 10                                                # 数字候选最小高度，单位 px；调大会过滤横向碎片，调小保留远处小数字
    max_digit_width: 0                                                  # 数字候选最大宽度，单位 px；0 表示不限制，设小可过滤整页边框
    max_digit_height: 0                                                 # 数字候选最大高度，单位 px；0 表示不限制，设小可过滤过高边线
    min_digit_width_ratio: 0.01                                         # 数字宽度相对 A4 宽度的最小比例；调大会去碎片，调小保留远处窄数字
    max_digit_width_ratio: 0.80                                         # 数字宽度相对 A4 宽度的最大比例；调小过滤宽边框块，调大允许大数字
    min_digit_height_ratio: 0.025                                       # 数字高度相对 A4 高度的最小比例；调大会去短碎片，调小保留远处数字
    max_digit_height_ratio: 0.90                                        # 数字高度相对 A4 高度的最大比例；调小过滤高边线，调大允许近距离数字
    min_digit_aspect_ratio: 0.20                                        # 数字候选高宽比下限；调大会过滤扁平横线
    max_digit_aspect_ratio: 12.0                                        # 数字候选高宽比上限；调小过滤过高竖线或边框
    min_candidate_extent: 0.06                                          # 轮廓面积占外接框面积的最小比例；调大会过滤稀疏边缘，调小保留空心数字
    max_candidate_extent: 0.99                                          # 轮廓面积占外接框面积的最大比例；调小过滤实心块，调大允许粗体数字
    reject_border_candidates: true                                      # 是否拒绝贴近 A4 边缘或超出中心窗口的候选；关闭可保留边缘数字但误检会增加
    a4_border_margin_px: 2                                              # A4 内边界固定忽略宽度，单位 px；调大会更强过滤边框，调小保留靠边数字
    a4_border_margin_ratio: 0.005                                       # A4 内边界相对忽略宽度比例；调大会更强过滤边缘，调小更容忍靠边数字
    min_candidate_center_x_ratio: 0.01                                  # 候选中心 x 最小比例；调大会过滤左侧候选，0.0 表示不限制左边界
    max_candidate_center_x_ratio: 0.99                                  # 候选中心 x 最大比例；调小过滤右侧候选，1.0 表示不限制右边界
    min_candidate_center_y_ratio: 0.01                                  # 候选中心 y 最小比例；调大会过滤上方候选，0.0 表示不限制上边界
    max_candidate_center_y_ratio: 0.99                                  # 候选中心 y 最大比例；调小过滤下方候选，1.0 表示不限制下边界
    max_vertical_line_width_px: 7                                       # 竖线噪声判定的最大宽度，单位 px；调大将更多窄竖线当噪声
    max_vertical_line_width_ratio: 0.035                                # 竖线噪声宽度相对 A4 宽度上限；调大过滤更多窄竖线
    min_vertical_line_aspect_ratio: 8.0                                 # 细竖线高宽比阈值；调大会减少误删数字 1，调小过滤更多竖线
    max_horizontal_line_height_px: 7                                    # 横线噪声判定的最大高度，单位 px；调大将更多低矮横线当噪声
    max_horizontal_line_height_ratio: 0.035                             # 横线噪声高度相对 A4 高度上限；调大过滤更多横线
    max_horizontal_line_aspect_ratio: 0.14                              # 扁平横线高宽比阈值；调小过滤更多横向笔画或线条
    crop_padding_px: 4                                                  # 最终数字裁剪固定扩边，单位 px；调大保留更多边缘，调小裁剪更紧
    crop_padding_ratio: 0.025                                           # 最终数字裁剪相对扩边比例；调大保留更多上下文但可能带入噪声
    union_fallback_padding_px: 10                                       # 联合兜底裁剪固定扩边，单位 px；调大保留更多候选周边
    union_fallback_padding_ratio: 0.05                                  # 联合兜底裁剪相对扩边比例；调大更宽松但噪声更多
    enable_union_split: true                                            # 是否把过宽联合候选尝试拆成两个数字；关闭可避免误拆单个宽数字
    union_split_min_width_height_ratio: 1.20                            # 联合候选触发拆分的宽高比下限；调大会减少拆分，调小更容易拆两位数
    union_split_min_valley_ratio: 0.28                                  # 拆分所需谷底与侧峰墨迹比例；调低要求更明显间隙，调高更容易拆分
    enable_relaxed_digit_fallback: true                                 # 严格过滤为空时是否救回形状最像的候选；开启提高召回但可能增加误识别
    relaxed_fallback_min_score: 0.20                                    # 宽松兜底候选最低评分；调大会更严格，调小救回更多边缘或大候选
    digit_input_size: 64                                                # 送入分类器的归一化数字图尺寸，单位 px；需与模型输入匹配
    max_digit_count: 3                                                  # 分割后最多保留的数字框数量，单位 个；调小抑制碎片，至少保留两位编号所需数量

    enable_relative_size_filter: true                                   # 是否按最大候选做相对尺寸过滤；开启可去碎片，关闭保留更多异常大小候选
    relative_filter_use_or: true                                        # 相对尺寸过滤条件是否使用 OR；true 更宽松，false 更严格
    min_area_ratio_to_largest: 0.10                                     # 相对最大候选的最小面积比例；调大会丢弃小碎片，调小保留远处数字
    min_height_ratio_to_largest: 0.30                                   # 相对最大候选的最小高度比例；调大会丢弃矮碎片

    enable_slender_digit_protection: false                              # 是否启用细长数字保护；开启可保护数字 1，但可能保留竖线噪声
    slender_min_height_ratio_to_largest: 0.40                           # 细长数字保护的最小相对高度；调大会更严格，仅在保护开启时生效
    slender_max_width_ratio_to_largest: 0.50                            # 细长数字保护的最大相对宽度；调小更偏向细数字，仅在保护开启时生效

    merge_gap_px: 24                                                    # 同一数字碎片可合并的最大水平间隙，单位 px；调大会更易合并断裂笔画
    merge_gap_ratio: 0.05                                               # 合并间隙相对 A4 尺寸比例；调大会更易合并远距离断裂数字
    enable_horizontal_merge: true                                       # 是否启用横向相邻碎片合并；关闭可减少相邻数字误合并
    enable_vertical_split_merge: true                                   # 是否启用上下断裂碎片合并；关闭可减少竖向误合并
    merge_vertical_overlap_min_ratio: 0.30                              # 横向合并所需最小垂直重叠比例；调大会更严格
    merge_min_y_overlap_ratio: 0.25                                     # 多轮同数字碎片合并的最小 y 重叠比例；调小合并更多，调大减少误合并
    merge_small_part_area_ratio_max: 0.30                               # 小碎片相对大碎片可合并的最大面积比例；调大更容易合并较大碎片
    merge_small_part_height_ratio_max: 0.72                             # 小碎片相对大碎片可合并的最大高度比例；调大更宽松
    merge_max_height_diff_px: 18                                        # 碎片合并允许的最大高度差，单位 px；调大允许高差更大的断裂笔画
    merge_max_height_diff_ratio: 0.55                                   # 碎片合并允许的最大高度差比例；调大更易合并不等高部分
    vertical_merge_gap_px: 10                                           # 竖向断裂合并允许的最大垂直间隙，单位 px；调大更易上下合并
    min_horizontal_overlap_ratio_for_vertical_merge: 0.55               # 竖向合并所需最小水平重叠比例；调大会更严格

    onnx_model_path: models/digit_cnn.onnx                              # 数字分类 ONNX 模型路径；可用包内相对路径或绝对路径
    classifier_min_confidence: 0.70                                     # 单个数字分类最低置信度比例；调大会更严格，调小更容易通过
    classifier_input_size: 64                                           # 分类器网络输入尺寸，单位 px；需与模型训练尺寸一致
    prefer_cuda: false                                                  # 是否优先使用 CUDA 推理后端；开启可提速但依赖硬件和运行库

    circle_marker_use_color: false                                      # 圆形标靶第一版是否使用颜色信息；false 表示仅使用灰度结构识别
    circle_marker_panel_gaussian_kernel: 5                              # marker panel 检测高斯模糊核尺寸，单位 px；通常取奇数
    circle_marker_panel_morph_kernel_size: 5                            # marker panel 检测形态学闭运算核尺寸，单位 px
    circle_marker_panel_min_area_ratio: 0.01                            # marker panel 候选面积占整图面积的最小比例
    circle_marker_panel_max_area_ratio: 0.90                            # marker panel 候选面积占整图面积的最大比例
    circle_marker_panel_approx_epsilon: 0.02                            # marker panel 四边形轮廓拟合精度比例
    circle_marker_panel_aspect_ratio: 1.414                             # 中间白色 marker panel 期望宽高比；默认临时按横向 A4，后续换标牌只改参数
    circle_marker_panel_aspect_tolerance: 0.35                          # marker panel 宽高比评分容差；调大更容忍长条或透视误差
    circle_marker_panel_warp_width: 640                                 # marker panel 透视矫正输出宽度，单位 px
    circle_marker_panel_warp_height: 452                                # marker panel 透视矫正输出高度，单位 px
    circle_marker_search_x_min_ratio: 0.10                              # panel 内圆形标靶搜索 ROI 左边界比例
    circle_marker_search_x_max_ratio: 0.90                              # panel 内圆形标靶搜索 ROI 右边界比例
    circle_marker_search_y_min_ratio: 0.10                              # panel 内圆形标靶搜索 ROI 上边界比例
    circle_marker_search_y_max_ratio: 0.90                              # panel 内圆形标靶搜索 ROI 下边界比例
    circle_marker_dark_threshold: 180                                   # 深色圆形区域灰度阈值；灰度小于该值视作暗区域候选
    circle_marker_bright_threshold: 190                                 # 圆内白色数字灰度阈值；灰度大于该值视作亮色数字候选
    circle_marker_use_otsu: true                                        # 是否融合 Otsu 自适应阈值，提高光照变化下的圆和数字提取稳定性
    circle_marker_min_area_ratio: 0.03                                  # 深色圆候选面积占 panel 面积的最小比例
    circle_marker_max_area_ratio: 0.55                                  # 深色圆候选面积占 panel 面积的最大比例
    circle_marker_min_circularity: 0.50                                 # 深色圆候选最小圆度，4*pi*area/perimeter^2
    circle_marker_aspect_min: 0.70                                      # 深色圆候选 bbox 宽高比下限
    circle_marker_aspect_max: 1.35                                      # 深色圆候选 bbox 宽高比上限
    circle_marker_digit_min_area_ratio: 0.001                           # 圆内数字候选面积占圆内区域面积的最小比例
    circle_marker_digit_max_area_ratio: 0.30                            # 圆内数字候选面积占圆内区域面积的最大比例
    circle_marker_digit_padding_ratio: 0.22                             # 圆内数字裁剪扩边比例；调大保留更多笔画边缘
    circle_marker_max_digits: 2                                         # 圆形标靶内最多识别数字位数；柜号 1-36 需要最多 2 位
    circle_marker_min_number: 1                                         # 圆形标靶接受的最小柜号
    circle_marker_max_number: 36                                        # 圆形标靶接受的最大柜号

distance_estimator_node:
  ros__parameters:
    scan_topic: /scan                                                   # 测距使用的激光雷达输入话题；改动会切换测距数据来源
    output_topic: /inventory/target_distance                            # 目标侧向距离输出话题；任务跟踪控制订阅该话题
    target_lidar_side_topic: /inventory/target_lidar_side               # 目标所在雷达侧向控制话题；任务管理器发布 left/right
    enable_topic: /inventory/distance_estimator_enable                  # 测距节点使能话题；关闭时不发布目标距离
    enable_on_start: true                                               # 启动后是否默认使能测距；设为 false 可等状态机进入对齐阶段再启用
    default_lidar_side: right                                           # 未收到侧向指令前默认测距侧；改动影响初始左/右侧采样
    left_lidar_center_deg: 90.0                                         # 左侧测距扇区中心角，单位 deg；调大会采样更偏后方
    right_lidar_center_deg: -90.0                                       # 右侧测距扇区中心角，单位 deg；调小会采样更偏后方
    side_lidar_window_deg: 6.0                                          # 侧向测距扇区角宽，单位 deg；调大会采样更多点但更易混入邻近障碍
    min_valid_distance: 0.05                                            # 测距接受的最小距离，单位 m；调大会过滤近距离噪声
    max_valid_distance: 6.0                                             # 测距接受的最大距离，单位 m；调小会忽略远处目标
    publish_rate_hz: 10.0                                               # 目标距离发布频率，单位 Hz；调大会更新更快但占用更多计算

gap_detector_node:
  ros__parameters:
    scan_topic: /scan                                                   # 间隙检测使用的激光雷达输入话题；改动会切换检测数据来源
    output_topic: /inventory/gap_status                                 # 间隙检测状态和调试值输出话题；任务管理器订阅该话题
    context_topic: /inventory/gap_context                               # 任务管理器发布的检测上下文话题；包含目标侧和调整信息
    enable_topic: /inventory/gap_detector_enable                        # 间隙检测使能话题；关闭时不进行有效检测输出
    entry_side_topic: /inventory/entry_side                             # 进入侧控制话题；任务管理器发布 left/right 给检测器
    entry_side: left                                                    # 未收到进入侧指令前默认侧；改动影响初始检测方向
    enable_on_start: true                                               # 启动后是否默认使能间隙检测；设为 false 可完全交由状态机控制
    base_link_frame: base_link                                          # 检测解释和日志使用的机器人坐标系名；改错会影响调试含义
    left_gap_sector_start_deg: 60.0                                     # 左侧主间隙检测扇区起始角，单位 deg；调大会缩小前向采样
    left_gap_sector_end_deg: 120.0                                      # 左侧主间隙检测扇区结束角，单位 deg；调大会扩大后向采样
    right_gap_sector_start_deg: -120.0                                  # 右侧主间隙检测扇区起始角，单位 deg；调小会扩大后向采样
    right_gap_sector_end_deg: -60.0                                     # 右侧主间隙检测扇区结束角，单位 deg；调小会缩小前向采样
    front_left_veto_sector_start_deg: 10.0                              # 左前近障硬否决扇区起始角，单位 deg；调大会缩小正前覆盖
    front_left_veto_sector_end_deg: 70.0                                # 左前近障硬否决扇区结束角，单位 deg；调大会扩大左侧覆盖
    left_front_veto_sector_start_deg: 10.0                              # 左侧路线前方否决扇区起始角，单位 deg；调大会减少正前检测
    left_front_veto_sector_end_deg: 70.0                                # 左侧路线前方否决扇区结束角，单位 deg；调大会扩大左前检测
    left_side_veto_sector_start_deg: 70.0                               # 左侧近障否决扇区起始角，单位 deg；调大会让检测更偏侧后
    left_side_veto_sector_end_deg: 120.0                                # 左侧近障否决扇区结束角，单位 deg；调大会扩大后侧覆盖
    right_front_veto_sector_start_deg: -70.0                            # 右侧路线前方否决扇区起始角，单位 deg；调小会扩大右前检测
    right_front_veto_sector_end_deg: -10.0                              # 右侧路线前方否决扇区结束角，单位 deg；调小会减少正前检测
    right_side_veto_sector_start_deg: -120.0                            # 右侧近障否决扇区起始角，单位 deg；调小会扩大后侧覆盖
    right_side_veto_sector_end_deg: -70.0                               # 右侧近障否决扇区结束角，单位 deg；调小让检测更偏侧前

    open_point_min_distance: 0.5                                        # 判定开放点的最小距离，单位 m；调大会要求间隙更空，调小更敏感
    near_obstacle_veto_distance: 0.5                                    # 近障硬否决距离阈值，单位 m；调大会更保守，调小更容易放行
    required_entry_width: 0.4                                           # 允许进入所需估计开口宽度，单位 m；调大会要求更宽间隙

    min_valid_range: 0.05                                               # 间隙检测接受的最小雷达距离，单位 m；调大会过滤近距离噪声
    max_valid_range: 8.0                                                # 间隙检测接受的最大雷达距离，单位 m；调小会忽略远距离开放点

    open_run_min_points: 3                                              # 构成连续开放段所需最小点数，单位 个；调大会更稳定但可能漏检窄间隙
    min_valid_points: 8                                                 # 单帧扇区评估所需最小有效点数，单位 个；调大会提高可靠性但更易无效
    open_ratio_threshold: 0.10                                          # 扇区开放点比例阈值；调大会更严格，调小更容易判定候选帧
    max_adjacent_angle_gap_deg: 2.0                                     # 相邻点仍视为连续的最大角度间隔，单位 deg；调大会允许稀疏点连接
    smoothing_window: 1                                                 # 帧指标平滑窗口长度，单位 帧；调大会更稳但响应更慢
    stable_frames_required: 50                                          # 判定稳定检测到间隙所需连续候选帧数，单位 帧；调大会更保守
    detect_cycle_timeout_sec: 2.5                                       # WAITING_GAP 单轮检测周期超时，单位 s；调大会等待更久，调小更快进入调整

    enable_csv_log: true                                                # 是否输出 CSV 调试日志；开启便于分析但会写入磁盘
    csv_log_dir: /tmp/agv_inventory_gap_logs                            # CSV 调试日志目录；改动会改变日志保存位置
    csv_file_prefix: gap_debug                                          # CSV 调试日志文件名前缀；改动便于区分不同实验

inventory_auto_recharger:
  ros__parameters:
    start_service_name: /inventory/auto_recharge/start                  # 自动回充启动服务名；节点启动后只等待该 service 请求
    cancel_service_name: /inventory/auto_recharge/cancel                # 自动回充取消服务名；取消时关闭底盘回充模式但不关闭 Nav2
    status_topic: /inventory/auto_recharge/status                       # 自动回充状态输出；IDLE/STARTING/NAVIGATING/DOCKING/CHARGING/CANCELING/COMPLETE/FAILED/CANCELED
    nav2_active_wait_timeout_sec: 60.0                                  # 收到回充请求后等待 Nav2 active 的超时，单位 s；超时不关闭 Nav2
    nav_feedback_timeout_sec: 120.0                                     # 接近充电桩但长时间未完成导航时的等待阈值，单位 s
    set_charge_timeout_sec: 2.0                                         # 单次 /set_charge 请求等待响应超时，单位 s；取消回充时也使用
    set_charge_retry_count: 3                                           # /set_charge 调用重试次数；取消回充失败会按 strict 策略返回失败
    set_charge_cancel_strict: true                                      # true 表示真实 DOCKING/CHARGING/贴桩 active 下 /set_charge=0 失败时 cancel 返回失败
    wait_charging_clear_timeout_sec: 5.0                                # /set_charge=0 后等待 robot_charging_flag=false 的超时，单位 s；超时 strict cancel 返回失败
    cancel_charge_disconnect_wait_sec: 2.0                              # cancel 最终失败前额外等待 robot_charging_flag=false 的宽限时间，避免话题回调晚到
    cancel_charge_disconnect_poll_interval_sec: 0.05                    # 宽限等待期间检查 robot_charging_flag 的周期，单位 s
    recharge_depart_enabled: true                                       # cancel 后 robot_charging_flag 仍 true 时是否执行低速离桩动作
    recharge_depart_speed_mps: 0.04                                     # 离桩速度，保留正负号；系统原生 E/e 使用 linear.x=+0.1，若方向相反改为负值，代码不要 abs()
    recharge_depart_duration_sec: 10.0                                  # timed 离桩持续时间，单位 s；期间持续发布 cmd_vel，不只发一帧
    recharge_depart_distance_m: 0.20                                    # 预留离桩目标距离，单位 m；当前自动回充 cancel 先采用 timed depart
    recharge_depart_timeout_sec: 5.0                                    # 离桩动作最大持续时间，单位 s；实际运行时间取 duration 与 timeout 的较小值
    recharge_depart_wait_charging_clear_sec: 5.0                        # 离桩后等待 robot_charging_flag=false 的超时，单位 s
    recharge_depart_require_set_charge_success: false                   # false 时 /set_charge=0 超时仍可低速尝试离桩，之后必须确认 robot_charging_flag=false
    nav_goal_frame: map                                                 # 自动回充导航目标坐标系
    charger_pose_x: 0.21353509531521975                                 # 自动回充导航目标 x 坐标，单位 m
    charger_pose_y: 0.026333288560603657                                # 自动回充导航目标 y 坐标，单位 m
    charger_pose_z: -0.121433301285056                                  # 自动回充导航目标姿态 z
    charger_pose_w: 0.9925995936625266                                  # 自动回充导航目标姿态 w
    robot_BatteryCapacity: 20000                                        # 电池容量参数，保留给原自动回充判断逻辑
    car_mode: senior_akm                                                # 底盘模式，影响红外对接标志设置
    diff_point: 1.2                                                     # 根据充电桩检测位姿外推导航目标的距离，单位 m
    diff_angle: -15.0                                                   # 根据充电桩检测位姿外推导航目标的角度，单位 deg

mission_manager_node:
  ros__parameters:
    recognized_topic: /inventory/recognized_number                      # 货柜编号识别输入话题；改错会导致目标识别结果不可用
    distance_topic: /inventory/target_distance                          # TARGET_TRACKING 使用的目标距离输入话题；影响侧向距离闭环
    gap_topic: /inventory/gap_status                                    # 间隙检测状态输入话题；用于 WAITING_GAP 判断是否可进入
    odom_topic: /odom_combined                                          # 主里程计输入话题；用于局部移动和姿态判断
    odom_fallback_topic: /odom                                          # 备用里程计输入话题；主话题超时后切换使用
    odom_primary_timeout_sec: 0.8                                       # 主里程计超时阈值，单位 s；调大会更久等待主源，调小更快切备用源
    scan_topic: /scan                                                   # 进入阶段安全检查使用的雷达话题；改动会切换避障数据来源

    mission_state_topic: /inventory/mission_state                       # 任务状态发布话题；外部监控通过该话题查看状态机
    mission_log_topic: /inventory/mission_log                           # 任务日志发布话题；外部界面或调试工具订阅
    cmd_vel_topic: /cmd_vel                                             # 任务管理器直接控制底盘时的速度输出话题；改错会失去运动控制
    motion_model: diff_drive                                            # 任务局部动作使用的底盘模型；diff_drive 表示原地转向加直行

    corridor_enable_topic: /inventory/corridor_enable                   # 走廊跟随使能发布话题；任务阶段切换时启停走廊控制
    corridor_reverse_topic: /inventory/corridor_reverse                 # 走廊跟随后退模式发布话题；退出或返程时控制方向
    gap_context_topic: /inventory/gap_context                           # 间隙检测上下文发布话题；向检测器传递目标侧和调整状态
    recognizer_enable_topic: /inventory/recognizer_enable               # 识别器使能发布话题；仅在搜索或跟踪阶段通常为 true
    gap_detector_enable_topic: /inventory/gap_detector_enable           # 间隙检测器使能发布话题；通常只在 WAITING_GAP 阶段打开
    distance_estimator_enable_topic: /inventory/distance_estimator_enable # 距离估计器使能发布话题；目标距离对齐阶段打开
    entry_side_topic: /inventory/entry_side                             # 发布给间隙检测器的进入侧话题；取值通常为 left/right
    target_lidar_side_topic: /inventory/target_lidar_side               # 发布给距离估计器的目标雷达侧话题；取值通常为 left/right
    current_target_cabinet_topic: /inventory/current_target_cabinet     # 发布当前目标货柜号；识别节点据此选择左/右相机，-1 表示无目标

    start_service_name: /inventory/start_mission                        # 启动盘库任务服务名；改名需同步 Web 或测试调用端
    cancel_service_name: /inventory/cancel_mission                      # 取消盘库任务服务名；改名需同步外部调用端
    return_home_service_name: /inventory/return_home                    # 中断盘库并回零点服务名；缝隙内会记录为待执行请求
    return_to_charge_service_name: /inventory/return_to_charge          # 中断盘库并自动回充服务名；缝隙内会记录为待执行请求
    safe_exit_gap_service_name: /inventory/safe_exit_gap                # 缝隙内手动安全出缝服务名；先停止盘库再低速倒退出缝
    stop_auto_charge_and_depart_service_name: /inventory/stop_auto_charge_and_depart # 停止自动充电并按配置速度符号离桩服务名
    inventory_auto_recharge_start_service_name: /inventory/auto_recharge/start # 盘库内部自动回充节点启动服务名
    inventory_auto_recharge_cancel_service_name: /inventory/auto_recharge/cancel # 盘库内部自动回充节点取消服务名
    cancel_auto_recharge_service_name: /inventory/cancel_auto_recharge  # 对外取消自动回充服务名；充电/回充标志仍 active 时也会转发到底层 cancel
    auto_recharge_status_topic: /inventory/auto_recharge/status          # 自动回充状态话题；CHARGING/COMPLETE 表示跨侧回充已到位
    auto_recharge_charging_flag_topic: robot_charging_flag               # 充电状态输入话题；true 可作为跨侧回充已到位的辅助判据
    auto_recharge_recharge_flag_topic: robot_recharge_flag               # 底盘回充模式标志输入话题；非 0 表示底盘可能仍在回充控制
    auto_recharge_service_timeout_sec: 3.0                              # 等待自动回充启动服务可用的超时，单位 s；超时不关闭 Nav2
    auto_recharge_cancel_timeout_sec: 3.0                               # 等待自动回充取消服务可用的超时，单位 s；超时不关闭 Nav2
    auto_recharge_cancel_response_timeout_sec: 15.0                     # 跨侧自动回充取消请求发出后等待 service response 的超时，单位 s
    safe_exit_gap_enabled: true                                         # 是否启用手动安全出缝；关闭后 safe_exit_gap 请求会拒绝执行
    safe_exit_gap_speed_mps: 0.05                                       # 安全出缝倒退线速度，单位 m/s；使用车体 x 负方向
    safe_exit_gap_yaw_kp: 0.6                                           # 安全出缝 yaw 保持比例增益；调大会纠偏更强
    safe_exit_gap_max_angular_z: 0.15                                   # 安全出缝 yaw 修正角速度限幅，单位 rad/s
    safe_exit_gap_extra_clearance_m: 0.30                               # 安全出缝在入缝实测距离外额外倒退余量，单位 m
    safe_exit_gap_timeout_sec: 30.0                                     # 安全出缝超时，单位 s；超时后停车并保持在缝隙内标志
    stop_auto_charge_depart_distance_m: 0.5                             # 停止自动充电后二级离桩距离，单位 m；Python cancel 已清 charging flag 时会跳过
    stop_auto_charge_depart_speed_mps: 0.05                             # 二级离桩速度，保留正负号；系统原生 E/e 为正向，方向相反可改负值
    stop_auto_charge_depart_yaw_kp: 0.6                                 # 二级离桩 yaw 保持比例增益
    stop_auto_charge_depart_max_angular_z: 0.15                         # 二级离桩 yaw 修正角速度限幅，单位 rad/s
    stop_auto_charge_depart_timeout_sec: 20.0                           # 离桩流程单阶段超时，单位 s
    stop_auto_charge_depart_stop_before_sec: 0.5                        # 自动回充取消成功后、离桩前停车等待时间，单位 s
    stop_auto_charge_depart_stop_after_sec: 0.5                         # 离桩到位后停车等待时间，单位 s
    recognizer_trigger_service: /inventory/trigger_recognition          # 可选识别器触发服务名；用于手动控制识别流程

    target_list: ["2-3-1-2"]                                            # 默认任务目标列表；元素描述目标组合，外部未传入时使用
    route_waypoints_file: config/route_waypoints.yaml                   # 路线航点配置文件路径；可用包内相对路径或绝对路径
    warehouse_layout_file: config/warehouse_layout.yaml                 # 货柜物理单元布局配置路径；调错会影响间隙和深度索引计算
    gap_scan_map_file: config/gap_scan_map.yaml                         # 间隙到货柜扫描映射配置路径；调错会影响进缝后扫描对象
    route_search_failure_policy: error                                  # 路线搜索失败策略；error 进入错误，return 尝试返航
    follow_distance: 0.50                                               # TARGET_TRACKING 期望跟随距离，单位 m；调大离目标更远，调小贴近目标
    warehouse_length: 12.0                                              # 仓库纵向参考长度，单位 m；影响返程方向和距离判断
    corridor_speed: 0.20                                                # 走廊搜索线速度，单位 m/s；调大会搜索更快但识别窗口更短
    tracking_speed: 0.20                                                # 跟踪目标货柜时线速度上限，单位 m/s；调大会更快但更难稳定识别
    entry_distance: 1.2                                                 # 兼容用固定进缝距离，单位 m；关闭网格中心进入时使用
    turn_speed: 0.40                                                    # 通用转向角速度，单位 rad/s；调大会转向更快但过冲风险更高
