    exit_gap_mode: reverse                                              # 退出间隙方式；reverse 表示倒车退出
    exit_gap_speed: 0.20                                                # 退出间隙速度，单位 m/s；调大会退出更快但安全余量变小
    exit_gap_extra_distance_m: 0.20                                     # 退出间隙额外距离，单位 m；调大会多退一些
    exit_gap_timeout_sec: 120.0                                         # 退出间隙超时，单位 s；调大会允许更慢退出
    exit_gap_distance_m: 1.50                                           # 退出间隙目标距离，单位 m；调大会倒退更远
    exit_gap_turn_enabled: true                                         # 直线倒出后是否原地转回走廊朝向；关闭会保持退出后的朝向
    exit_gap_turn_angular_speed: 0.25                                   # 退出后转向角速度，单位 rad/s；调大会转向更快
    exit_gap_turn_yaw_tolerance_rad: 0.08                               # 退出后转向完成偏航误差，单位 rad；调小更准但耗时更久
    exit_gap_turn_timeout_sec: 40.0                                     # 退出后转向超时，单位 s；调大会允许更慢完成转向
    reentry_for_position_adjustment: true                               # 是否允许为位置调整重新进入间隙；关闭可减少重复进出动作
    close_gap_after_final_exit: true                                    # 最终退出后是否请求关闭间隙；关闭会跳过关闭请求

    grid_motion_enabled: true                                           # 是否启用间隙内深度网格移动；关闭会跳过网格位移
    grid_spacing_m: 0.50                                                # 间隙内相邻扫描网格间距，单位 m；调大会每层移动更远
    grid_move_speed: 0.20                                               # 间隙内网格移动速度，单位 m/s；调大会移动更快但定位误差可能增大
    grid_move_timeout_sec: 50.0                                         # 间隙内网格移动超时，单位 s；调大会更容忍慢速移动
    grid_move_return_between_layers: false                              # 不同升降层之间是否回到网格起点；开启会增加回退动作但层间位置一致

    full_inventory_enabled: true                                        # 是否启用全量盘库队列；关闭会跳过全量任务流程
    inventory_plan: [4, 3, 8, 7]                                        # 全量盘库货柜编号计划列表；调整会改变任务顺序和目标
    recognize_in_idle: true                                             # IDLE 状态是否保持货柜编号识别；开启便于待机观察，关闭可省资源
    recognize_during_nav: false                                         # Nav2 导航期间是否保持识别；开启可提前发现目标但占用算力
    inventory_left_route: left_route                                    # 左/上排盘库使用的路线名；需与路线航点配置一致
    inventory_right_route: right_route                                  # 右/下排盘库使用的路线名；需与路线航点配置一致

    same_side_next_search_enabled: true                                 # 退出间隙后是否启用同侧下一目标搜索；关闭会减少连续盘库能力
    same_side_search_speed: 0.10                                        # 同侧下一目标搜索速度，单位 m/s；调大会搜索更快但识别时间更短
    same_side_search_timeout_sec: 40.0                                  # 同侧下一目标搜索超时，单位 s；调大会搜索更久
    same_side_pose_hold_enabled: true                                   # 同侧搜索时是否保持固定 y 和航向；关闭会减少位姿约束
    same_side_left_fixed_y_m: 0.660                                     # 左/上排同侧搜索保持的 y 坐标，单位 m；改动会改变横向基准
    same_side_left_fixed_yaw_rad: -3.1400                               # 左/上排同侧搜索保持的航向，单位 rad；改动会改变车头方向
    same_side_right_fixed_y_m: -0.360                                   # 右/下排同侧搜索保持的 y 坐标，单位 m；改动会改变横向基准
    same_side_right_fixed_yaw_rad: -3.1400                              # 右/下排同侧搜索保持的航向，单位 rad；改动会改变车头方向
    same_side_yaw_kp: 0.80                                              # 同侧搜索航向保持比例增益；调大会纠偏更强
    same_side_yaw_deadband_rad: 0.03                                    # 同侧搜索航向误差死区，单位 rad；调大会减少小幅修正
    same_side_y_kp: 0.30                                                # 同侧搜索 y 坐标保持比例增益；调大会横向修正更强
    same_side_y_deadband_m: 0.15                                        # 同侧搜索 y 坐标误差死区，单位 m；调大会减少小幅横向修正
    same_side_y_correction_sign: 1.0                                    # 同侧搜索 y 修正方向符号；改为负值会反转横向修正方向
    same_side_max_angular: 0.15                                         # 同侧搜索最大角速度，单位 rad/s；调大会允许更快姿态修正
    full_inventory_same_side_recognition_delay_enabled: true            # 同侧继续搜索下一目标时是否延迟开启/采信识别；仅作用于全量盘库同侧分支
    full_inventory_same_side_recognition_delay_distance_m: 1.0          # 同侧搜索开始后延迟采信识别的行驶距离，单位 m；达到后恢复原识别逻辑

    overall_final_recognition_wait_sec: 20.0                            # 全量盘库最终识别等待时间，单位 s；调大会等待最终结果更久
    recognition_fallback_enabled: true                                  # 是否启用识别失败兜底搜索；关闭会在识别失败时更快报错
    recognition_fallback_speed: 0.10                                    # 识别兜底移动速度，单位 m/s；调大会搜索更快但可能错过目标
    recognition_fallback_wait_sec: 5.0                                  # 每次识别兜底动作后的等待时间，单位 s；调大会给识别更多稳定时间
    recognition_fallback_timeout_sec: 20.0                              # 识别兜底总超时，单位 s；调大会允许更长搜索
    recognition_fallback_sequence_m: [0.20, -0.20, 0.30]                # 识别兜底移动距离序列，单位 m；正负号决定前后搜索方向


    scan_layers: 2                                                      # 盘库扫描层数，单位 层；调大会扫描更多高度层
    scan_depth_count: 3                                                 # 每个货柜深度方向扫描点数量，单位 个；调大会覆盖更多深度位置
    web_base_url: ""                                                    # Web 服务基础地址；为空时通常使用本地模式，填写后请求远端接口
    web_open_gap_endpoint: "/api/gap/open"                              # 打开间隙 API 路径；改动需与 Web 后端接口一致
    web_close_gap_endpoint: "/api/gap/close"                            # 关闭间隙 API 路径；改动需与 Web 后端接口一致
    web_status_endpoint: "/api/robot/status"                            # 机器人状态上报 API 路径；改动需与 Web 后端接口一致
    web_result_endpoint: "/api/inventory/result"                        # 盘库结果上报 API 路径；改动需与 Web 后端接口一致

lift_relay_controller:
  ros__parameters:
    lift_default_port: /dev/lift_relay                                  # 升降杆继电器稳定串口名；真实设备当前映射到 CH341 USB
    lift_baud: 38400                                                    # 继电器 Modbus RTU 波特率
    lift_slave: 1                                                       # 继电器 Modbus 从站地址
    lift_modbus_mode: coil05                                            # 默认使用已验证的 05 写线圈方式；register06 仅预留
    lift_register_base_addr: 0                                          # register06 预留寄存器起始地址，默认不影响 coil05
    lift_register_on_value: 1                                           # register06 预留开启值，默认不影响 coil05
    lift_register_off_value: 0                                          # register06 预留关闭值，默认不影响 coil05
    lift_speed_mps: 0.026                                               # 升降杆估算速度，单位 m/s；用于预估高度积分
    lift_min_height_m: 0.0                                              # 升降杆预估最低高度，单位 m
    lift_max_height_m: 1.5                                              # 升降杆预估最高高度，单位 m
    lift_manual_duration_sec: 2.0                                       # GUI/诊断默认点动时间，单位 s
    lift_home_duration_sec: 2.0                                         # home 默认下降时间，单位 s；不足以到底时不强制归零
    lift_home_force_zero_when_complete: false                           # 是否允许 home 完成后强制预估高度归零
    lift_max_run_duration_sec: 100.0                                    # 单次运动最大运行时间硬限制，单位 s
    lift_settle_sec: 0.2                                                # Y3 断电和方向继电器切换后的等待时间，单位 s
    lift_serial_timeout_sec: 1.0                                        # 串口读写超时，单位 s
    lift_reconnect_attempts: 5                                          # 串口异常后的重连尝试次数
    lift_action_recover_attempts: 5                                     # 单次升降动作中的动作级恢复尝试次数
    lift_port_wait_timeout_sec: 5.0                                     # 打开串口前等待 /dev/lift_relay 出现的最长时间，单位 s
    lift_port_wait_interval_sec: 0.2                                    # 等待串口设备文件时的检查间隔，单位 s
    lift_open_retry_count: 5                                            # 打开串口失败后的重试次数
    lift_open_retry_interval_sec: 0.5                                   # 打开串口失败后的重试间隔，单位 s
    lift_verbose_modbus: false                                          # 是否打印 Modbus 收发帧
    lift_state_topic: /lift/state                                       # 升降杆状态发布话题

inventory_operation_gui:
  ros__parameters:
    lift_state_topic: /lift/state                                       # GUI 显示升降杆预估状态的话题
    lift_up_service_name: /lift/up                                      # GUI 上升按钮调用服务
    lift_down_service_name: /lift/down                                  # GUI 下降按钮调用服务
    lift_stop_service_name: /lift/stop                                  # GUI 停止按钮调用服务
    lift_all_off_service_name: /lift/all_off                            # GUI 全关按钮调用服务
    lift_manual_duration_sec: 5.0                                       # GUI 上升/下降固定点动时间，单位 s
