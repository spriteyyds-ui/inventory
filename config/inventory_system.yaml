    continue_on_error: false                                            # 单个目标失败后是否继续下一个目标；开启可提高任务连续性但可能跳过异常
    control_rate_hz: 10.0                                               # 任务管理器主控制循环频率，单位 Hz；调大会响应更快但 CPU 占用增加

