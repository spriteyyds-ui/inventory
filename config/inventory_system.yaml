    inventory_left_route: left_route                                    # 左/上排盘库使用的路线名；需与路线航点配置一致
    inventory_right_route: right_route                                  # 右/下排盘库使用的路线名；需与路线航点配置一致
    return_home_between_sides: true                                     # 左右两侧任务之间是否先返航；开启更稳但耗时增加
    return_home_after_full_inventory: true                              # 全量盘库结束后是否返航；关闭会停在最后任务位置

    same_side_next_search_enabled: true                                 # 退出间隙后是否启用同侧下一目标搜索；关闭会减少连续盘库能力
    same_side_search_speed: 0.10                                        # 同侧下一目标搜索速度，单位 m/s；调大会搜索更快但识别时间更短
    same_side_search_timeout_sec: 40.0                                  # 同侧下一目标搜索超时，单位 s；调大会搜索更久
    same_side_pose_hold_enabled: true                                   # 同侧搜索时是否保持固定 y 和航向；关闭会减少位姿约束
    same_side_left_fixed_y_m: 0.790                                     # 左/上排同侧搜索保持的 y 坐标，单位 m；改动会改变横向基准
    same_side_left_fixed_yaw_rad: -3.1400                               # 左/上排同侧搜索保持的航向，单位 rad；改动会改变车头方向
    same_side_right_fixed_y_m: -0.6174                                  # 右/下排同侧搜索保持的 y 坐标，单位 m；改动会改变横向基准
    same_side_right_fixed_yaw_rad: -3.1400                              # 右/下排同侧搜索保持的航向，单位 rad；改动会改变车头方向
    same_side_yaw_kp: 0.40                                              # 同侧搜索航向保持比例增益；调大会纠偏更强
    same_side_yaw_deadband_rad: 0.03                                    # 同侧搜索航向误差死区，单位 rad；调大会减少小幅修正
    same_side_y_kp: 0.30                                                # 同侧搜索 y 坐标保持比例增益；调大会横向修正更强
    same_side_y_deadband_m: 0.03                                        # 同侧搜索 y 坐标误差死区，单位 m；调大会减少小幅横向修正
    same_side_y_correction_sign: 1.0                                    # 同侧搜索 y 修正方向符号；改为负值会反转横向修正方向
    same_side_max_angular: 0.15                                         # 同侧搜索最大角速度，单位 rad/s；调大会允许更快姿态修正

    overall_final_recognition_wait_sec: 20.0                            # 全量盘库最终识别等待时间，单位 s；调大会等待最终结果更久
    recognition_fallback_enabled: true                                  # 是否启用识别失败兜底搜索；关闭会在识别失败时更快报错
    recognition_fallback_speed: 0.10                                    # 识别兜底移动速度，单位 m/s；调大会搜索更快但可能错过目标
    recognition_fallback_wait_sec: 5.0                                  # 每次识别兜底动作后的等待时间，单位 s；调大会给识别更多稳定时间
    recognition_fallback_timeout_sec: 20.0                              # 识别兜底总超时，单位 s；调大会允许更长搜索
    recognition_fallback_sequence_m: [0.20, -0.20, 0.30]                # 识别兜底移动距离序列，单位 m；正负号决定前后搜索方向


    scan_layers: 2                                                      # 盘库扫描层数，单位 层；调大会扫描更多高度层
    scan_depth_count: 3                                                 # 每个货柜深度方向扫描点数量，单位 个；调大会覆盖更多深度位置
    web_base_url: ""                                                    # Web 服务基础地址；为空时通常使用本地模式，填写后请求远端接口
