    real_motion_target_cabinet: 4                                       # 单柜真实运动目标货柜编号；改动会改变单柜测试目标
    real_motion_target_gap: gap_02_03_04                                # 单柜真实运动目标间隙 ID；需与间隙映射配置一致
    real_motion_stop_after_scan: false                                  # 单柜扫描后是否立即停止任务；开启便于单柜调试
    real_motion_final_recognition_wait_sec: 20.0                        # 单柜流程最终识别等待时间，单位 s；调大会等待识别更久

    side_row_inventory_enabled: true                                    # 是否启用同侧相邻间隙盘库流程；关闭会跳过该流程
    side_row_inventory_name: row_01_02_03_04                            # 同侧盘库流程名称；用于日志和任务区分
    side_row_first_gap: gap_02_03_04                                    # 同侧盘库第一处进入间隙 ID；需与映射配置一致
    side_row_first_gap_scan_sequence: [4, 3]                            # 第一处间隙扫描货柜顺序，单位 货柜编号列表；调整会改变扫描先后
    side_row_second_gap: gap_01_02_03                                   # 同侧盘库第二处进入间隙 ID；需与映射配置一致
    side_row_second_gap_scan_sequence: [2, 1]                           # 第二处间隙扫描货柜顺序，单位 货柜编号列表；调整会改变扫描先后
    side_row_corridor_transfer_enabled: true                            # 两处间隙之间是否通过走廊转移；关闭会减少转移动作
    side_row_corridor_transfer_target_cabinet: 2                        # 走廊转移阶段用于定位的目标货柜编号；改动会改变转移参照
    side_row_corridor_transfer_direction: toward_cabinet_1              # 走廊转移方向标识；改变会影响搜索移动方向

    exit_gap_after_each_scan: true                                      # 每次扫描后是否退出间隙；关闭会留在间隙内继续后续动作
    exit_gap_mode: reverse                                              # 退出间隙方式；reverse 表示倒车退出
    exit_gap_speed: 0.15                                                # 退出间隙速度，单位 m/s；调大会退出更快但安全余量变小
    exit_gap_extra_distance_m: 0.10                                     # 退出间隙额外距离，单位 m；调大会多退一些
    exit_gap_timeout_sec: 40.0                                          # 退出间隙超时，单位 s；调大会允许更慢退出
    exit_gap_distance_m: 1.60                                           # 退出间隙目标距离，单位 m；调大会倒退更远
    exit_gap_turn_enabled: true                                         # 直线倒出后是否原地转回走廊朝向；关闭会保持退出后的朝向
    exit_gap_turn_angular_speed: 0.25                                   # 退出后转向角速度，单位 rad/s；调大会转向更快
    exit_gap_turn_yaw_tolerance_rad: 0.08                               # 退出后转向完成偏航误差，单位 rad；调小更准但耗时更久
    exit_gap_turn_timeout_sec: 40.0                                     # 退出后转向超时，单位 s；调大会允许更慢完成转向
    reentry_for_position_adjustment: true                               # 是否允许为位置调整重新进入间隙；关闭可减少重复进出动作
    close_gap_after_final_exit: true                                    # 最终退出后是否请求关闭间隙；关闭会跳过关闭请求

    grid_motion_enabled: true                                           # 是否启用间隙内深度网格移动；关闭会跳过网格位移
    grid_spacing_m: 0.30                                                # 间隙内相邻扫描网格间距，单位 m；调大会每层移动更远
    grid_move_speed: 0.10                                               # 间隙内网格移动速度，单位 m/s；调大会移动更快但定位误差可能增大
    grid_move_timeout_sec: 50.0                                         # 间隙内网格移动超时，单位 s；调大会更容忍慢速移动
    grid_move_return_between_layers: false                              # 不同升降层之间是否回到网格起点；开启会增加回退动作但层间位置一致

