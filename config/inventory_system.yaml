    same_side_search_timeout_sec: 120.0                                  # 同侧下一目标搜索超时，单位 s；调大会搜索更久
    same_side_pose_hold_enabled: true                                   # 同侧搜索期间是否启用 y/yaw 闭环修正；关闭则开环直走
    same_side_fixed_y_from_current_pose_enabled: true                  # 同侧搜索开始时是否用当前位姿 y 作为 fixed_y；false 则使用 YAML 配置值
    same_side_left_fixed_y_m: -2.009                                     # 左/上排同侧搜索保持的 y 坐标，单位 m；改动会改变横向基准
    same_side_left_fixed_yaw_rad: 0.0000                                  # 左/上排同侧搜索保持的航向，单位 rad；新地图方向相反，由 -π 改为 0
    same_side_right_fixed_y_m: 6.581                                   # 右/下排同侧搜索保持的 y 坐标，单位 m；改动会改变横向基准
    same_side_right_fixed_yaw_rad: 0.0                                  # 右/下排同侧搜索保持的航向，单位 rad；新地图方向相反，由 -π 改为 0
    same_side_yaw_kp: 0.40                                              # 同侧搜索航向保持比例增益；调大会纠偏更强
    same_side_yaw_kd: 0.0                                               # 同侧搜索航向微分增益；大于 0 启用 PD 控制，抑制超调
    same_side_yaw_deadband_rad: 0.02                                    # 同侧搜索航向误差死区，单位 rad；超过后才施加 yaw 修正
    same_side_min_angular: 0.03                                         # 同侧搜索最小角速度，单位 rad/s；超过 yaw 死区后保证最小修正
    same_side_y_kp: 0.30                                                # 同侧搜索 y 坐标保持比例增益；调大会横向修正更强
    same_side_y_deadband_m: 0.05                                        # 同侧搜索 y 坐标误差死区，单位 m；调大会减少小幅横向修正
    same_side_y_correction_sign: 1.0                                    # 同侧搜索 y 修正方向符号；改为负值会反转横向修正方向
    same_side_max_angular: 0.15                                         # 同侧搜索最大角速度，单位 rad/s；调大会允许更快姿态修正
    full_inventory_same_side_recognition_delay_enabled: true            # 同侧继续搜索下一目标时是否延迟开启/采信识别；仅作用于全量盘库同侧分支
    full_inventory_same_side_recognition_delay_distance_m: 0.8          # 同侧搜索开始后延迟采信识别的行驶距离，单位 m；达到后恢复原识别逻辑
    rear_target_handling_enabled: true                                  # 同一 physical_units 内下一个目标需要从后方搜索时是否启用后方目标处理
    rear_target_handle_mode: "hold_entry_yaw_backup"                    # 后方目标处理方式；保持 entry_turn_start_yaw，不做 180 度掉头
    rear_target_turn_yaw_tolerance_rad: 0.08                             # 后方目标 yaw 微调收敛阈值，单位 rad；调小更准但耗时更久
    rear_target_turn_timeout_sec: 10.0                                   # 后方目标 yaw 微调超时，单位 s；超时进入全量盘库 ERROR
    rear_target_backup_enabled: true                                     # yaw 微调后是否倒车固定距离，再进入同侧搜索
    rear_target_backup_distance_m: 3.60                                  # 后方目标倒车距离，单位 m；3->2 首版按现场确认使用 1.5m
    rear_target_backup_speed: 0.15                                       # 后方目标倒车速度，单位 m/s；现场验证后正式值
    rear_target_backup_timeout_sec: 120.0                                # 后方目标倒车超时，单位 s；2.80m/0.20m/s 约 14s
    rear_target_backup_pose_hold_enabled: true                          # 回退阶段是否启用 y/yaw 闭环修正；关闭则只用 yaw_hold_command
    rear_target_backup_fixed_y_from_current_pose_enabled: true          # 回退开始时是否用当前位姿 y 作为 fixed_y；false 则用 same_side active fixed_y
    rear_target_backup_y_correction_sign: -1.0                          # 回退 y 修正方向符号；-1.0 因倒车时 angular.z 横向效应与前进相反

    # 直线跟踪控制模式
    stanley_line_control_enabled: true                                  # 是否启用直线跟踪；关闭回退到旧 y/yaw PD 逻辑
