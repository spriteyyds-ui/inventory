    scan_duration_sec: 5.0                                              # 单次扫描动作持续时间，单位 s；主动串口模式建议与 rfid_scan_duration_sec 一致
    scan_timeout_sec: 5.0                                               # 等待扫描完成超时，单位 s；调大会允许扫描设备更慢返回
