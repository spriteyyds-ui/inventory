    stanley_yaw_kd: 0.0                                                 # 航向误差微分增益；默认 0 不启用 D 项
    stanley_yaw_deadband_rad: 0.012                                     # 航向误差死区，单位 rad
    stanley_min_angular: 0.008                                           # 最小角速度，单位 rad/s
    stanley_max_angular: 0.15                                            # 最大角速度，单位 rad/s
    stanley_yaw_offset_lpf_tau_sec: 1.0                                 # yaw_offset 低通滤波时间常数，单位 s；0=不滤波

    # ===== 黄线巡线控制 =====
    line_follow_control_mode: "yellow_line"                              # 巡线控制模式：stanley=原逻辑, yellow_line=黄线巡线, auto=黄线优先+Stanley回退, off=无横向修正
    yellow_line_follow_enabled: true                                     # 启用黄线巡线；rear_target_backup 和 same_side_search 均使用黄线
    yellow_line_use_in_same_side_search: true                            # 同侧搜索使用黄线巡线；前进时黄线横向纠偏
    yellow_line_use_in_rear_target_backup: true                          # 后方目标回退使用黄线巡线；后退时黄线横向纠偏
    yellow_line_use_in_restore_backup: false                             # 出缝回退是否使用黄线巡线；默认关闭
    yellow_line_use_in_gap_search: true                                  # SEARCH_GAP 搜缝阶段使用黄线巡线；沿走廊前进/后退时横向纠偏
    yellow_line_use_in_post_gap_detect_advance: true                     # 缝隙检测后前进对齐阶段使用黄线巡线；沿走廊直行时横向纠偏
    yellow_line_use_in_gap_entry: false                                  # 入缝是否使用黄线巡线；默认关闭，先不让黄线影响入缝
    yellow_line_detect_only: false                                       # 只识别不控制模式；true 时只运行图像识别和发布 debug，不改变小车控制
    yellow_line_image_topic: "/camera/color/image_raw"                   # 前方相机图像话题；Orbbec ASTRA S 默认话题
    yellow_line_roi_y_min_ratio: 0.50                                    # ROI 上边界比例；图像高度的 55% 处开始
    yellow_line_roi_y_max_ratio: 0.90                                    # ROI 下边界比例；图像高度的 95% 处结束
    yellow_line_target_x_ratio: 0.84                                    # 前进时黄线目标 x 位置比例；现场标定值
    yellow_line_target_x_offset_px: 0.0                                  # 目标 x 偏移像素；用于现场手动标定微调
    yellow_h_min: 15                                                     # 黄色 HSV H 最小值
    yellow_h_max: 40                                                     # 黄色 HSV H 最大值
    yellow_s_min: 80                                                     # 黄色 HSV S 最小值
    yellow_s_max: 255                                                    # 黄色 HSV S 最大值
    yellow_v_min: 80                                                     # 黄色 HSV V 最小值
    yellow_v_max: 255                                                    # 黄色 HSV V 最大值
    yellow_line_min_area: 300.0                                          # 最小轮廓面积；过滤噪声
    yellow_line_lost_timeout_sec: 5.5                                    # 丢线超时，单位 s；yellow_line 模式超时停车，auto 模式超时 fallback
    yellow_line_initial_grace_sec: 2.0                                   # 首帧图像后宽限期，单位 s；宽限期内不触发 lost 停车，等待相机稳定
    yellow_line_kp: 0.5                                                  # 巡线 P 增益；现场标定值，适中响应
    yellow_line_kd: 0.03                                                 # 巡线 D 增益；现场标定值，轻微抑制超调
    yellow_line_max_angular: 0.15                                        # 最大角速度，单位 rad/s；现场标定值，安全限幅
    yellow_line_reverse_invert_angular: false                            # 后退时不翻转角速度方向；标准 PD 符号对后退同样适用
    yellow_line_backward_target_x_ratio_right_entry: 0.84                # 右入缝后退目标 x 比例；现场标定值
    yellow_line_backward_target_x_ratio_left_entry: 0.16                 # 左入缝后退目标 x 比例；理论镜像初值，可独立标定
    yellow_line_backward_target_x_ratio: 0.84                            # 后退时黄线目标 x 比例；兼容 fallback
    yellow_line_backward_kp: 0.40                                        # 后退巡线 P 增益；符号验证阶段保守值
    yellow_line_backward_kd: 0.00                                        # 后退巡线 D 增益；符号验证阶段关闭 D
    yellow_line_backward_max_angular: 0.05                               # 后退最大角速度；符号验证阶段严格限幅
    yellow_line_debug_image_enabled: true                                # 发布调试图像；可在 rv2 中查看识别效果
    yellow_line_debug_image_topic: "/yellow_line/debug_image"            # 调试图像话题名

    overall_final_recognition_wait_sec: 20.0                            # 全量盘库最终识别等待时间，单位 s；调大会等待最终结果更久
    recognition_fallback_enabled: true                                  # 是否启用识别失败兜底搜索；关闭会在识别失败时更快报错
    recognition_fallback_speed: 0.10                                    # 识别兜底移动速度，单位 m/s；调大会搜索更快但可能错过目标
    recognition_fallback_wait_sec: 5.0                                  # 每次识别兜底动作后的等待时间，单位 s；调大会给识别更多稳定时间
    recognition_fallback_timeout_sec: 20.0                              # 识别兜底总超时，单位 s；调大会允许更长搜索
    recognition_fallback_sequence_m: [-0.20, 0.40, -0.30]                # 识别兜底移动距离序列，单位 m；正负号决定前后搜索方向


    scan_layers: 2                                                      # 盘库扫描层数，单位 层；调大会扫描更多高度层
    scan_depth_count: 3                                                 # 每个货柜深度方向扫描点数量，单位 个；调大会覆盖更多深度位置
    cabinet_depth_count_overrides: ["1:4", "2:4", "3:4", "4:4", "5:4", "6:4", "7:4", "8:4", "9:4", "10:4", "11:4", "12:4", "13:4", "14:4", "15:4", "16:4", "17:4", "18:4"]  # 按柜号覆盖深度格数量；格式 cabinet_id:depth_count；未列出的柜号使用全局 scan_depth_count
    web_base_url: ""                                                    # Web 服务基础地址；为空时通常使用本地模式，填写后请求远端接口
    web_open_gap_endpoint: "/api/gap/open"                              # 打开间隙 API 路径；改动需与 Web 后端接口一致
    web_close_gap_endpoint: "/api/gap/close"                            # 关闭间隙 API 路径；改动需与 Web 后端接口一致
    web_status_endpoint: "/api/robot/status"                            # 机器人状态上报 API 路径；改动需与 Web 后端接口一致
    web_result_endpoint: "/api/inventory/result"                        # 盘库结果上报 API 路径；改动需与 Web 后端接口一致

lift_relay_controller:
  ros__parameters:
    lift_default_port: /dev/lift_relay                                  # 升降杆继电器稳定串口名；真实设备当前映射到 CH341 USB
    lift_baud: 38400                                                    # 继电器 Modbus RTU 波特率
    lift_slave: 1                                                       # 继电器 Modbus 从站地址
    lift_modbus_mode: coil05                                            # 默认使用已验证的 05 写线圈方式；register06 仅预留
    lift_register_base_addr: 0                                          # register06 预留寄存器起始地址，默认不影响 coil05
    lift_register_on_value: 1                                           # register06 预留开启值，默认不影响 coil05
    lift_register_off_value: 0                                          # register06 预留关闭值，默认不影响 coil05
    lift_speed_mps: 0.026                                               # 升降杆估算速度，单位 m/s；用于预估高度积分
    lift_min_height_m: 0.0                                              # 升降杆预估最低高度，单位 m
    lift_max_height_m: 1.5                                              # 升降杆预估最高高度，单位 m
    lift_manual_duration_sec: 2.0                                       # GUI/诊断默认点动时间，单位 s
    lift_home_duration_sec: 2.0                                         # home 默认下降时间，单位 s；不足以到底时不强制归零
    lift_home_force_zero_when_complete: false                           # 是否允许 home 完成后强制预估高度归零
    lift_max_run_duration_sec: 100.0                                    # 单次运动最大运行时间硬限制，单位 s
    lift_settle_sec: 0.2                                                # Y3 断电和方向继电器切换后的等待时间，单位 s
    lift_serial_timeout_sec: 1.0                                        # 串口读写超时，单位 s
    lift_reconnect_attempts: 5                                          # 串口异常后的重连尝试次数
    lift_action_recover_attempts: 5                                     # 单次升降动作中的动作级恢复尝试次数
    lift_port_wait_timeout_sec: 5.0                                     # 打开串口前等待 /dev/lift_relay 出现的最长时间，单位 s
    lift_port_wait_interval_sec: 0.2                                    # 等待串口设备文件时的检查间隔，单位 s
    lift_open_retry_count: 5                                            # 打开串口失败后的重试次数
    lift_open_retry_interval_sec: 0.5                                   # 打开串口失败后的重试间隔，单位 s
    lift_verbose_modbus: false                                          # 是否打印 Modbus 收发帧
    lift_state_topic: /lift/state                                       # 升降杆状态发布话题

inventory_operation_gui:
  ros__parameters:
    lift_state_topic: /lift/state                                       # GUI 显示升降杆预估状态的话题
    lift_up_service_name: /lift/up                                      # GUI 上升按钮调用服务
    lift_down_service_name: /lift/down                                  # GUI 下降按钮调用服务
    lift_stop_service_name: /lift/stop                                  # GUI 停止按钮调用服务
    lift_all_off_service_name: /lift/all_off                            # GUI 全关按钮调用服务
    lift_manual_duration_sec: 5.0                                       # GUI 上升/下降固定点动时间，单位 s
    robot_api_status_url: "http://192.168.1.100:8000/status"                # GUI 轮询网页接收/上传状态接口
    robot_api_health_url: "http://192.168.1.100:8000/health"                # /status 不可用时的健康检查兜底接口
    robot_api_poll_interval_ms: 2000                                    # GUI 轮询网页接收服务状态周期，单位 ms
    robot_api_request_timeout_sec: 0.5                                  # GUI 单次 HTTP 状态请求超时，单位 s；保持较短避免卡界面

# ==========================================================================
# robot_inventory_client 参数块
# 本块中的 URL 应与上方 mission_manager_node 的 rfid_upload_url / error_report_url
# 保持一致。改地址时请同时修改两处。
# ==========================================================================
robot_inventory_client:
  ros__parameters:
    java_result_url: "https://192.168.1.100:8099/RobotInspection/inventoryAudit"   # 盘库结果上传地址
    java_status_url: "https://192.168.1.100:8099/RobotInspection/errorReport"       # ERROR 状态上报地址
    java_verify_tls: false                                                          # HTTPS 证书校验；false 等效 curl -k
    request_timeout_sec: 5.0                                                        # HTTP 请求超时，单位 s
    upload_retry_count: 3                                                           # 上传失败重试次数
    api_host: "0.0.0.0"                                                             # FastAPI uvicorn 监听地址
    api_port: 8000                                                                  # FastAPI uvicorn 监听端口

# ==========================================================================
# yellow_line_test_node 参数块
# 独立测试节点，只做黄线识别和 debug 发布，不控制小车。
# 参数名与 mission_manager_node 的黄线参数一致，方便统一配置。
# ==========================================================================
yellow_line_test_node:
  ros__parameters:
    yellow_line_image_topic: "/camera/color/image_raw"                   # 前方相机图像话题
    yellow_line_roi_y_min_ratio: 0.50                                    # ROI 上边界比例
    yellow_line_roi_y_max_ratio: 0.90                                    # ROI 下边界比例
    yellow_line_target_x_ratio: 0.84                                     # 黄线目标 x 位置比例；现场标定值
    yellow_line_target_x_offset_px: 0.0                                  # 目标 x 偏移像素
    yellow_h_min: 15                                                     # 黄色 HSV H 最小值
    yellow_h_max: 40                                                     # 黄色 HSV H 最大值
    yellow_s_min: 80                                                     # 黄色 HSV S 最小值
    yellow_s_max: 255                                                    # 黄色 HSV S 最大值
    yellow_v_min: 80                                                     # 黄色 HSV V 最小值
    yellow_v_max: 255                                                    # 黄色 HSV V 最大值
    yellow_line_min_area: 300.0                                          # 最小轮廓面积
    yellow_line_lost_timeout_sec: 5.5                                    # 丢线超时；与正式盘库一致
    yellow_line_kp: 0.5                                                  # 巡线 P 增益；现场标定值
    yellow_line_kd: 0.03                                                 # 巡线 D 增益；现场标定值
    yellow_line_max_angular: 0.15                                        # 最大角速度；现场标定值
    yellow_line_reverse_invert_angular: false                            # 后退时不翻转角速度方向
    yellow_line_debug_image_enabled: true                                # 测试节点默认开启 debug 图像
    yellow_line_debug_image_topic: "/yellow_line/debug_image"            # 调试图像话题
    test_linear_speed: 0.15                                              # 测试用线速度（仅用于打印计算结果）

# ==========================================================================
# yellow_line_drive_test_node 参数块
# 独立巡线驾驶测试，不依赖盘库流程，只做前进/后退巡线。
# ==========================================================================
yellow_line_drive_test_node:
  ros__parameters:
    yellow_line_image_topic: "/camera/color/image_raw"                   # 前方相机图像话题
    cmd_vel_topic: "/cmd_vel"                                            # 速度发布话题
    yellow_line_roi_y_min_ratio: 0.50                                    # ROI 上边界比例
    yellow_line_roi_y_max_ratio: 0.90                                    # ROI 下边界比例
    yellow_line_target_x_ratio: 0.84                                    # 前进时黄线目标 x 位置比例；现场标定值
    yellow_line_target_x_offset_px: 0.0                                  # 目标 x 偏移像素
    yellow_h_min: 15                                                     # 黄色 HSV H 最小值
    yellow_h_max: 40                                                     # 黄色 HSV H 最大值
    yellow_s_min: 80                                                     # 黄色 HSV S 最小值
    yellow_s_max: 255                                                    # 黄色 HSV S 最大值
    yellow_v_min: 80                                                     # 黄色 HSV V 最小值
    yellow_v_max: 255                                                    # 黄色 HSV V 最大值
    yellow_line_min_area: 300.0                                          # 最小轮廓面积
    yellow_line_lost_timeout_sec: 5.5                                    # 丢线超时停车；与正式盘库一致
    yellow_line_kp: 0.5                                                  # 前进巡线 P 增益；现场标定值
    yellow_line_kd: 0.03                                                 # 前进巡线 D 增益；现场标定值
    yellow_line_max_angular: 0.15                                        # 前进最大角速度；现场标定值
    yellow_line_reverse_invert_angular: false                            # 后退时不翻转角速度方向；与正式盘库参数一致
    yellow_line_debug_image_enabled: true                                # 发布调试图像
    yellow_line_debug_image_topic: "/yellow_line/debug_image"            # 调试图像话题
    test_linear_speed: 0.20                                              # 前进线速度，单位 m/s
    test_backward_linear_speed: 0.20                                     # 后退线速度，单位 m/s；与 rear_target_backup_speed 一致
    yellow_line_backward_target_x_ratio_right_entry: 0.84               # 右入缝后退目标 x 比例；与正式盘库一致
    yellow_line_backward_target_x_ratio_left_entry: 0.16                # 左入缝后退目标 x 比例；与正式盘库一致
    yellow_line_backward_target_x_ratio: 0.84                           # 后退时黄线目标 x 位置比例；兼容 fallback
    yellow_line_backward_kp: 0.40                                        # 后退巡线 P 增益；与正式盘库参数一致
    yellow_line_backward_kd: 0.00                                        # 后退巡线 D 增益；与正式盘库参数一致
    yellow_line_backward_max_angular: 0.05                               # 后退最大角速度；与正式盘库参数一致
