web_client_mode: local

open_gap_wait_sec: 5.0
close_gap_wait_sec: 3.0
scanner_enabled: true
scan_duration_sec: 2.0
scan_timeout_sec: 5.0
scan_retry_count: 0
scan_result_timeout_sec: 2.0
lift_enabled: true
lift_motion_duration_sec: 3.0
lift_motion_timeout_sec: 6.0
lift_level_count: 2
lift_home_level: 1
grid_motion_duration_sec: 1.0
grid_motion_timeout_sec: 10.0

real_motion_enabled: true
real_motion_target_cabinet: 4
real_motion_target_gap: gap_02_03_04
real_motion_stop_after_scan: false
real_motion_final_recognition_wait_sec: 20.0

side_row_inventory_enabled: true
side_row_inventory_name: row_01_02_03_04

side_row_first_gap: gap_02_03_04
side_row_first_gap_scan_sequence: [4, 3]

side_row_second_gap: gap_01_02_03
side_row_second_gap_scan_sequence: [2, 1]

side_row_corridor_transfer_enabled: true
side_row_corridor_transfer_target_cabinet: 2
side_row_corridor_transfer_direction: toward_cabinet_1

exit_gap_after_each_scan: true
exit_gap_mode: reverse
exit_gap_speed: 0.05
exit_gap_extra_distance_m: 0.10
exit_gap_timeout_sec: 40.0
exit_gap_distance_m: 1.40
exit_gap_turn_enabled: true
exit_gap_turn_angular_speed: 0.25
exit_gap_turn_yaw_tolerance_rad: 0.08
exit_gap_turn_timeout_sec: 16.0

reentry_for_position_adjustment: true

grid_motion_enabled: true
grid_spacing_m: 0.30
grid_move_speed: 0.04
grid_move_timeout_sec: 10.0
grid_move_return_between_layers: false

close_gap_after_final_exit: true

# Full inventory queue. When the compatibility service is called with
# run_all_configured=true and empty gap_id, this sequence is executed target by target.
full_inventory_enabled: true
inventory_plan: [4, 3, 8, 7]
recognize_during_nav: false

# Route names used for each cabinet side during full inventory.
inventory_left_route: left_route
inventory_right_route: right_route

# Return to the recorded start pose when the next target changes side, and after the last target.
return_home_between_sides: true
return_home_after_full_inventory: true

# Same-side next target search after exiting a gap. This drives slowly while recognition is enabled.
same_side_next_search_enabled: true
same_side_search_speed: 0.04
same_side_search_timeout_sec: 40.0

# Enable fixed map-y / fixed-yaw hold during same-side next search.
same_side_pose_hold_enabled: true

# Left-side same-side search pose hold.
same_side_left_fixed_y_m: 0.575
same_side_left_fixed_yaw_rad: -3.1400

# Right-side same-side search pose hold.
# It is left y minus 1.2 m: 0.575 - 1.2 = -0.625.
same_side_right_fixed_y_m: -0.625
same_side_right_fixed_yaw_rad: -3.1400

# Yaw-hold proportional gain.
same_side_yaw_kp: 0.40

# Yaw deadband.
same_side_yaw_deadband_rad: 0.03

# Map-y correction gain.
same_side_y_kp: 0.30

# Map-y deadband.
same_side_y_deadband_m: 0.03

# Sign for y correction. If real robot moves away from fixed y, change this to -1.0.
same_side_y_correction_sign: 1.0

# Max angular correction during same-side search.
same_side_max_angular: 0.15

# After a side route finishes, stop and recognize the target before enabling target ranging.
overall_final_recognition_wait_sec: 5.0

# Fixed recognition fallback after post-route recognition timeout.
recognition_fallback_enabled: true
recognition_fallback_speed: 0.04
recognition_fallback_wait_sec: 2.0
recognition_fallback_timeout_sec: 20.0
recognition_fallback_sequence_m: [-0.30, 0.60, -0.30]

# After gap_detector reports a stable enterable gap, continue along the search direction
# before turning into the gap.
post_gap_detect_advance_enabled: true
post_gap_detect_advance_distance_m: 0.25
post_gap_detect_advance_speed: 0.04
post_gap_detect_advance_timeout_sec: 8.0

scan_layers: 2
scan_depth_count: 3

web_base_url: ""
web_open_gap_endpoint: "/api/gap/open"
web_close_gap_endpoint: "/api/gap/close"
web_status_endpoint: "/api/robot/status"
web_result_endpoint: "/api/inventory/result"

test_inventory_plan:
  - gap_id: gap_01_02_03
    scan_cabinets: [1, 2, 3]

  - gap_id: gap_02_03_04
    scan_cabinets: [4, 3, 2]

  - gap_id: gap_05_06_07
    scan_cabinets: [5, 6, 7]

  - gap_id: gap_06_07_08
    scan_cabinets: [8, 7, 6]
