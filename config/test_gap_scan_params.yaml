enable_test_gap_scan: true
web_client_mode: mock

open_gap_wait_sec: 5.0
close_gap_wait_sec: 3.0
scan_placeholder_wait_sec: 2.0
lift_placeholder_wait_sec: 3.0
move_grid_placeholder_wait_sec: 1.0

test_motion_mode: ackermann_reentry_test

test_real_motion_enabled: true
test_real_motion_single_cabinet_only: true
test_real_motion_target_cabinet: 4
test_real_motion_target_gap: gap_02_03_04
test_real_motion_stop_after_scan: false
test_real_final_recognition_wait_sec: 20.0

test_real_side_row_enabled: true
test_real_side_row_name: row_01_02_03_04

test_real_side_row_first_gap: gap_02_03_04
test_real_side_row_first_gap_scan_sequence: [4, 3]

test_real_side_row_second_gap: gap_01_02_03
test_real_side_row_second_gap_scan_sequence: [2, 1]

test_real_side_row_corridor_transfer_enabled: true
test_real_side_row_corridor_transfer_target_cabinet: 2
test_real_side_row_corridor_transfer_direction: toward_cabinet_1

test_real_exit_after_each_scan: true
test_real_exit_mode: reverse
test_real_exit_speed: 0.05
test_real_exit_extra_distance_m: 0.10
test_real_exit_timeout_sec: 40.0
test_real_exit_distance_m: 1.20
test_real_exit_turn_enabled: true
test_real_exit_turn_angular_speed: 0.25
test_real_exit_turn_yaw_tolerance_rad: 0.08
test_real_exit_turn_timeout_sec: 8.0

test_real_reentry_for_position_adjustment: true
test_real_reentry_comment: "Use reverse-exit and re-enter as a temporary replacement for in-gap orientation/position adjustment."

test_real_grid_motion_enabled: true
test_real_grid_spacing_m: 0.30
test_real_grid_move_speed: 0.04
test_real_grid_move_timeout_sec: 10.0
test_real_grid_move_return_between_layers: false

test_real_close_gap_after_final_exit: true

scan_layers: 2
scan_depth_count: 3
default_scan_side: left

web_base_url: ""
web_open_gap_endpoint: "/api/gap/open"
web_close_gap_endpoint: "/api/gap/close"
web_status_endpoint: "/api/robot/status"
web_result_endpoint: "/api/inventory/result"

test_inventory_plan:
  - gap_id: gap_01_02_03
    scan_cabinets: [1, 2, 3]

  - gap_id: gap_02_03_04
    scan_cabinets: [4, 3, 2]

  - gap_id: gap_05_06_07
    scan_cabinets: [5, 6, 7]

  - gap_id: gap_06_07_08
    scan_cabinets: [8, 7, 6]
